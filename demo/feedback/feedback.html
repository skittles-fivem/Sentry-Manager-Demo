<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Feedback · Sentry Six Manager demo</title>
  <link rel="icon" type="image/png" href="/web/icon.png">
  <link rel="stylesheet" href="/web/shell.css">
  <link rel="stylesheet" href="/demo/feedback.css">
</head>
<body>
  <main class="fb card">
    <p class="fb-kicker"><span class="sentry-demo-dot" aria-hidden="true"></span> Sentry Six Manager demo</p>
    <h1>Feedback</h1>
    <p class="muted small" id="intro">What worked, what didn't, what you'd want. It goes to the person who runs this demo, with your IP address and your device's details (OS, browser, screen, graphics) to help track down bugs.</p>
    <p class="fb-off" id="off" hidden>Feedback is off on this demo.</p>
    <form id="form" novalidate>
      <label class="field">Your message
        <textarea class="input" name="message" id="message" rows="7" maxlength="2000" required></textarea>
        <span class="muted small fb-count" id="count">0 / 2000</span></label>
      <label class="field">Name or contact <span class="muted small">(optional)</span>
        <input class="input" name="contact" id="contact" maxlength="100" autocomplete="off"></label>
      <label class="field">Which page <span class="muted small">(optional)</span>
        <input class="input" name="page" id="page" maxlength="200" autocomplete="off"></label>
      <!-- left empty by people: bots fill it -->
      <div class="fb-hp" aria-hidden="true"><label>Website<input name="website" id="website" tabindex="-1" autocomplete="off"></label></div>
      <p class="fb-note" id="note" role="status" aria-live="polite"></p>
      <div class="fb-actions"><button class="btn solid" type="submit" id="send">Send</button><a class="btn ghost" href="/" id="back">Back to the demo</a></div>
    </form>
  </main>
  <script src="/demo/device.js"></script>
  <script src="/demo/feedback.js"></script>
</body>
</html>

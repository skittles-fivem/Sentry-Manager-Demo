# Sentry Six Manager demo: the real app, no sign-in, nothing can be changed,
# highway-only demo drives. Everything resets every 24 hours (and on restart);
# the attack log, bans, imported footage and certificates are kept in the
# demo-state volume.
#
#   cp .env.example .env     # the owner password, feedback, Let's Encrypt, Cloudflare
#   docker compose up -d
#   open https://<server>     (or http://, sent on to https://)
#
# Ports 80 and 443 both go to the app's one port, 9000, which answers plain
# HTTP (Let's Encrypt's check, else a redirect) and HTTPS on it. Behind
# Cloudflare: SSL/TLS mode Full until Let's Encrypt has issued the
# certificate, then Full (strict). See README.md, "On the internet".

services:
  sentry-manager-demo:
    image: ghcr.io/skittles-fivem/sentry-manager-demo:latest
    # Let's Encrypt (TLS_ACME_DOMAIN) needs a manager
    # image that has them; until the published one does, build on one that does:
    # build:
    #   context: .
    #   args:
    #     MANAGER_TAG: latest
    container_name: sentry-manager-demo
    hostname: demo
    restart: unless-stopped
    ports:
      - "80:9000"
      - "443:9000"
    environment:
      TZ: America/Chicago
      # hours between resets; the app starts over with fresh demo data
      DEMO_RESET_HOURS: "24"
      # exports waiting or rendering at once, for all visitors together
      DEMO_EXPORT_QUEUE: "2"
      # the Encoder's pretend conversion over this server and two nodes (off: none)
      DEMO_FAKE_ENCODER: "on"
      # the Sentry USB tab's info for each demo car, as a Pi writes it on the share (off: none)
      DEMO_SENTRYUSB: "on"
      # From .env (see .env.example); empty turns each off.
      # the owner page at /owner: local network only, with this password
      DEMO_OWNER_PASSWORD: ${DEMO_OWNER_PASSWORD:-}
      # visitors' feedback, sent to this Discord webhook (never shown to anyone)
      DEMO_FEEDBACK_WEBHOOK: ${DEMO_FEEDBACK_WEBHOOK:-}
      # Let's Encrypt for this name; its certificates are kept in demo-state
      TLS_ACME_DOMAIN: ${TLS_ACME_DOMAIN:-}
      TLS_ACME_EMAIL: ${TLS_ACME_EMAIL:-}
      # behind Cloudflare's proxy: the visitor's address is CF-Connecting-IP
      # (only from Cloudflare's own ranges), for the attack log, bans and limits
      TRUST_CLOUDFLARE: ${TRUST_CLOUDFLARE:-0}
    # Data and footage live in memory and start fresh at every reset.
    tmpfs:
      - /data:uid=1000,gid=1000,size=2g
      - /footage:uid=1000,gid=1000,size=8g
    volumes:
      # Kept across resets: the attack log, bans, visitor counts, feedback
      # limits, the owner's imported footage (import, sanitized, published)
      # and the certificates (Let's Encrypt has rate limits). Give it room for
      # the footage you upload.
      - demo-state:/demo-state
      # Your prepared footage folder (footage/, can_logs/), read-only: the demo
      # shows it as it is, and only it. DEMO_FOOTAGE_DIR in .env, else the
      # folder this file is in (when it sits inside your footage folder).
      - ${DEMO_FOOTAGE_DIR:-.}:/demo-import:ro
    # A public box: no privileges at all, a read-only image, bounded use.
    read_only: true
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 3g
    cpus: 2

volumes:
  demo-state:
    # a fixed name, so the owner page's blur command can name it
    name: sentry-manager-demo-state
